<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced SIP Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sip-card">
        <h1>Advanced SIP Calculator</h1>
        <p class="subtitle">
            Plan your wealth with step-up, inflation & tax adjustments.
        </p>

       <div class="calculator">

    <div class="inputs">
        <!-- ALL your labels + inputs + button go here -->
        <label>
            Monthly Investment (₹)
            <input type="number" id="monthlyInvestment" value="15000" min="0">
        </label>

        <label>
            Expected Return (% p.a.)
            <input type="number" id="returnRate" value="15">
        </label>

        <label>
            Investment Duration (Years)
            <input type="number" id="years" value="15">
        </label>

        <label>
            Annual Step-Up (%)
            <input type="number" id="stepUp" value="0">
        </label>

        <label>
            Inflation Rate (%)
            <input type="number" id="inflation" value="0">
        </label>

        <button onclick="calculateSIP()">Calculate</button>
    </div>

    <div class="result-card" id="result">
        <!-- Results will appear here -->
    </div>

</div>

    </div>

    <script src="js/calculator.js"></script>
</body>
</html>

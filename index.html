<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced SIP Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sip-card">
        <h1>Advanced SIP Calculator</h1>
        <p class="subtitle">
            Plan your wealth with step-up, inflation & tax adjustments.
        </p>

        <div class="calculator">
            <div class="inputs">
                <label>
                    Monthly Investment (₹)
                    <input type="number" id="monthlyInvestment" value="15000" min="0">
                </label>

                <label>
                    Expected Return (% p.a.)
                    <input type="number" id="returnRate" value="15">
                </label>

                <label>
                    Investment Duration (Years)
                    <input type="number" id="years" value="15">
                </label>

                <label>
                    Annual Step-Up (%)
                    <input type="number" id="stepUp" value="0">
                </label>

                <label>
                    Inflation Rate (%)
                    <input type="number" id="inflation" value="0">
                </label>

                <button onclick="calculateSIP()">Calculate</button>

                <div class="chart-container" style="margin-top: 30px; position: relative; height:300px;">
                    <canvas id="growthChart"></canvas>
                </div>
            </div>

            <div class="result-card" id="result">
                </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="js/calculator.js"></script>
</body>
</html>

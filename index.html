<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced SIP Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Advanced SIP Calculator</h1>
    <p>Plan your wealth with step-up, inflation & tax adjustments.</p>

    <div class="calculator">
        <label>
            Monthly Investment (₹):
            <input type="number" id="monthlyInvestment" value="15000" min="0">
        </label>

        <label>
            Expected Return (%):
            <input type="number" id="returnRate" value="15" min="0" max="30" step="0.1">
        </label>
        
        <label>
            Investment Duration (Years):
            <input type="number" id="years" value="15" min="1" max="60">
        </label>

        <label>
            Annual Step-Up (%):
            <input type="number" id="stepUp" value="0" min="0" max="30" step="0.1">
        </label>

        <label for="inflation">
            Inflation Rate (%)
           <input type="number" id="inflation" value="0" min="0" max="15" step="0.1">

        <button onclick="calculateSIP()">Calculate</button>

        <h2 id="result"></h2>
    </div>
        <p>
         Value in today’s money (after inflation):
         <strong id="realValue">₹0</strong>
         </p>

    <script src="js/calculator.js"></script>
</body>
</html>
